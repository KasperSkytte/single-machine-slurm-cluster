---
# --------------------------------------------------------------------------
# Cluster identity
# --------------------------------------------------------------------------
cluster_name: "hurtigcluster"

# --------------------------------------------------------------------------
# Slurm version + build
# --------------------------------------------------------------------------
# Pin the exact release to build. Check https://www.schedmd.com/downloads/
# (or `git ls-remote --tags https://github.com/SchedMD/slurm.git`) for
# newer releases and bump this yourself when you want to upgrade.
slurm_version: "26.05.1"
# Force a rebuild even if `slurmd --version` already matches slurm_version
# (e.g. after changing configure flags or build dependencies).
slurm_force_rebuild: false

slurm_src_dir: /usr/local/src/slurm
# /usr/local so binaries land in /usr/local/bin & /usr/local/sbin, which are
# already on $PATH for everyone -- no separate profile.d shim needed.
slurm_prefix: /usr/local
slurm_sysconfdir: /etc/slurm

slurm_user: slurm
slurm_group: slurm
slurm_system_uid: 981
slurm_system_gid: 981

# --------------------------------------------------------------------------
# Memory reservation for the host OS
# --------------------------------------------------------------------------
# Amount of RAM (in GiB) that is NEVER handed out to Slurm jobs. This is
# enforced two ways: MemSpecLimit in slurm.conf (reserves it + confines
# slurmd/slurmstepd to it) and ConstrainRAMSpace in cgroup.conf (hard-caps
# total job memory via cgroups so jobs collectively can't exceed
# RealMemory - MemSpecLimit).
mem_reserved_gb: 5

# --------------------------------------------------------------------------
# Per-job private /tmp, /var/tmp, /dev/shm (namespace/tmpfs, formerly
# job_container/tmpfs -- renamed in Slurm 25.11). Each job gets its own,
# emptied on job exit instead of sharing the host's /tmp.
# --------------------------------------------------------------------------
slurm_job_container_tmpfs_enable: true
slurm_job_container_tmpfs_basepath: /var/lib/slurm/job_container_tmpfs
slurm_job_container_tmpfs_dirs: "/tmp,/var/tmp,/dev/shm"
slurm_job_container_tmpfs_shared: true

# --------------------------------------------------------------------------
# Accounting database (MariaDB, used by slurmdbd)
# --------------------------------------------------------------------------
mysql_slurm_db: slurm_acct_db
mysql_slurm_user: slurm
