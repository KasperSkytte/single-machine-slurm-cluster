vault_mysql_slurm_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          62653637616465353831633566653535303761663364613966633165626137663661663863333139
          6332616337323266353365396230323939373130623030620a386363306236373430373730613639
          61383537623565336562393466326636303936663138656264383865636465386134636261333535
          3038343937303435610a383135326338653661346466363036626639626430356632313038376239
          64633664653565323161613766343265343931653832633237396234643162396461

# --------------------------------------------------------------------------
# slurm-mail (https://github.com/neilmunday/slurm-mail)
# --------------------------------------------------------------------------
# Pin the exact release tag to build. Check
# https://github.com/neilmunday/slurm-mail/tags for newer releases.
slurm_mail_version: "v4.34"
slurm_mail_src_dir: /usr/local/src/slurm-mail
slurm_mail_conf_dir: /etc/slurm-mail
slurm_mail_spool_dir: /var/spool/slurm-mail
slurm_mail_log_dir: /var/log/slurm-mail
# Where `python3 setup.py install` (run as root, system Python) places the
# slurm-spool-mail / slurm-send-mail console scripts on Debian/Ubuntu.
slurm_mail_bin_dir: /usr/local/bin

# Proton Mail native SMTP submission (requires a Proton plan with SMTP
# submission enabled, plus an app password generated in Proton Mail
# settings -> IMAP/SMTP). See README for details.
proton_email: "kasper@cafekapper.dk"
proton_smtp_server: smtp.protonmail.ch
proton_smtp_port: 587
