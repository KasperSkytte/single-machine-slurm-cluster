---
- name: Deploy Slurm logrotate config
  ansible.builtin.template:
    src: logrotate-slurm.j2
    dest: /etc/logrotate.d/slurm
    owner: root
    group: root
    mode: "0644"

- name: Deploy /etc/profile.d/slurm.sh (squeue/sinfo defaults, sq alias)
  ansible.builtin.template:
    src: profile-slurm.sh.j2
    dest: /etc/profile.d/slurm.sh
    owner: root
    group: root
    mode: "0644"

# /etc/profile.d/*.sh only runs for login shells; VS Code's integrated and
# Remote-SSH terminals (among others) start a non-login shell, so it never
# sources it -- duplicate the same content into bashrc too. Rendered from
# the same template as above (rather than copy-pasted) so the two can't
# drift out of sync.
- name: Make Slurm shell env available in non-login shells too
  ansible.builtin.blockinfile:
    path: /etc/bash.bashrc
    marker: "# {mark} ANSIBLE MANAGED BLOCK - slurm sq alias"
    block: "{{ lookup('ansible.builtin.template', 'profile-slurm.sh.j2') }}"
    state: present

- name: Deploy slurm.conf
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: "{{ slurm_sysconfdir }}/slurm.conf"
    owner: root
    group: "{{ slurm_group }}"
    mode: "0644"
  notify:
    - restart slurmctld
    - restart slurmd

- name: Deploy cgroup.conf
  ansible.builtin.template:
    src: cgroup.conf.j2
    dest: "{{ slurm_sysconfdir }}/cgroup.conf"
    owner: root
    group: "{{ slurm_group }}"
    mode: "0644"
  notify:
    - restart slurmctld
    - restart slurmd

- name: Deploy gres.conf
  ansible.builtin.template:
    src: gres.conf.j2
    dest: "{{ slurm_sysconfdir }}/gres.conf"
    owner: root
    group: "{{ slurm_group }}"
    mode: "0644"
  when: has_gpus
  notify: restart slurmd

- name: Deploy job_container.conf
  ansible.builtin.template:
    src: job_container.conf.j2
    dest: "{{ slurm_sysconfdir }}/job_container.conf"
    owner: root
    group: "{{ slurm_group }}"
    mode: "0644"
  when: slurm_job_container_tmpfs_enable
  notify: restart slurmd

- name: Deploy slurmdbd.conf
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: "{{ slurm_sysconfdir }}/slurmdbd.conf"
    owner: "{{ slurm_user }}"
    group: "{{ slurm_group }}"
    mode: "0600"
  notify: restart slurmdbd

- name: Reload systemd units
  ansible.builtin.systemd:
    daemon_reload: true

# On config changes on later runs, the restart handlers (above) fire at
# the end of the play, after these tasks, in the same dbd -> ctld -> d
# order, and take care of applying the new config.
- name: Enable and start slurmdbd
  ansible.builtin.systemd:
    name: slurmdbd
    enabled: true
    state: started

- name: Wait for slurmdbd to accept connections
  ansible.builtin.command: "{{ slurm_prefix }}/bin/sacctmgr show cluster"
  register: _sacctmgr_probe
  changed_when: false
  retries: 10
  delay: 3
  until: _sacctmgr_probe.rc == 0

- name: Check whether cluster is already registered with slurmdbd
  ansible.builtin.command: "{{ slurm_prefix }}/bin/sacctmgr show cluster {{ cluster_name }} -n -P"
  changed_when: false
  register: _cluster_check

- name: Register cluster with slurmdbd
  ansible.builtin.command: "{{ slurm_prefix }}/bin/sacctmgr -i add cluster {{ cluster_name }}"
  when: _cluster_check.stdout == ""

- name: Enable and start slurmctld
  ansible.builtin.systemd:
    name: slurmctld
    enabled: true
    state: started

- name: Enable and start slurmd
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: started
