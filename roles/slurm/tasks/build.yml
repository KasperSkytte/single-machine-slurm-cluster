---
- name: Install Slurm build dependencies
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - build-essential
      - fakeroot
      - git
      - wget
      - bzip2
      - pkg-config
      - libmunge2
      - libmunge-dev
      - libmariadb-dev
      - libmariadb-dev-compat
      - libpam0g-dev
      - libreadline-dev
      - libhwloc-dev
      - liblz4-dev
      - libsystemd-dev
      - libdbus-1-dev
    state: present

- name: Create slurm group
  ansible.builtin.group:
    name: "{{ slurm_group }}"
    gid: "{{ slurm_system_gid }}"
    system: true

- name: Create slurm user
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    uid: "{{ slurm_system_uid }}"
    group: "{{ slurm_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/slurm
    create_home: true

- name: Create Slurm directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: "{{ slurm_sysconfdir }}", owner: root, group: "{{ slurm_group }}" }
    - { path: /var/spool/slurmctld, owner: "{{ slurm_user }}", group: "{{ slurm_group }}" }
    - { path: /var/spool/slurmdbd, owner: "{{ slurm_user }}", group: "{{ slurm_group }}" }
    - { path: /var/spool/slurmd, owner: root, group: root }
    - { path: /var/log/slurm, owner: "{{ slurm_user }}", group: "{{ slurm_group }}" }
    - { path: "{{ slurm_src_dir }}", owner: root, group: root }

- name: Check currently installed Slurm version
  ansible.builtin.command: "{{ slurm_prefix }}/sbin/slurmd --version"
  register: _slurmd_installed
  changed_when: false
  failed_when: false

- name: Determine whether Slurm needs to be (re)built
  ansible.builtin.set_fact:
    _slurm_needs_build: "{{ slurm_force_rebuild or _slurmd_installed.rc != 0 or (_slurmd_installed.stdout.split() | last) != slurm_version }}"

- name: Download Slurm {{ slurm_version }} source tarball
  ansible.builtin.get_url:
    url: "https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2"
    dest: "{{ slurm_src_dir }}/slurm-{{ slurm_version }}.tar.bz2"
    mode: "0644"
  when: _slurm_needs_build

- name: Extract Slurm source
  ansible.builtin.unarchive:
    src: "{{ slurm_src_dir }}/slurm-{{ slurm_version }}.tar.bz2"
    dest: "{{ slurm_src_dir }}"
    remote_src: true
  when: _slurm_needs_build

- name: Configure, build and install Slurm
  ansible.builtin.shell: |
    set -e
    ./configure \
      --prefix={{ slurm_prefix }} \
      --sysconfdir={{ slurm_sysconfdir }} \
      --with-munge \
      --enable-pkgconfig
    make -j
    make install
  args:
    chdir: "{{ slurm_src_dir }}/slurm-{{ slurm_version }}"
    executable: /bin/bash
  when: _slurm_needs_build
  notify:
    - restart slurmdbd
    - restart slurmctld
    - restart slurmd

- name: Install Perl dev headers (needed for Slurm's contrib Perl API)
  ansible.builtin.apt:
    name: libperl-dev
    state: present
  when: slurm_build_contrib

# contribs/ includes nss_slurm, seff, sgather, sjobexit, pam_slurm_adopt,
# the Perl API, torque wrappers, etc. Same rebuild logic as the main
# build above: only runs when a (re)build actually happens, so turning
# this on after Slurm's already built at the same version needs
# slurm_force_rebuild: true once too.
- name: Build and install Slurm contrib tools
  ansible.builtin.shell: |
    set -e
    make -j contrib
    make install-contrib
  args:
    chdir: "{{ slurm_src_dir }}/slurm-{{ slurm_version }}"
    executable: /bin/bash
  when: slurm_build_contrib and _slurm_needs_build

- name: Configure dynamic linker for Slurm libraries
  ansible.builtin.template:
    src: ld-slurm.conf.j2
    dest: /etc/ld.so.conf.d/slurm.conf
    mode: "0644"
  register: _ldconf

- name: Run ldconfig
  ansible.builtin.command: ldconfig
  when: _ldconf.changed

- name: Copy generated systemd unit files
  ansible.builtin.copy:
    src: "{{ slurm_src_dir }}/slurm-{{ slurm_version }}/etc/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    remote_src: true
    mode: "0644"
  loop:
    - slurmctld.service
    - slurmd.service
    - slurmdbd.service
